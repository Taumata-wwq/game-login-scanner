<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>人机验证</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #1c1c1c; color: #e4e4e4; overflow: hidden;
    font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #hint {
    position: fixed; top: 12px; left: 0; right: 0;
    text-align: center; font-size: 12px; color: #9a9a9a;
  }
  /* 官方 demo 方式：容器 inline-block 居中，极验自行布局。 */
  #box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
  <div id="hint">请完成下方人机验证…</div>
  <div id="box"></div>
  <script src="https://static.geetest.com/v4/gt4.js"></script>
  <script>
  (function () {
    const T = window.__TAURI__;
    const invoke = T && T.core ? T.core.invoke : null;
    const params = new URLSearchParams(location.search);
    const captchaId = params.get('captcha_id') || '';
    const sessionId = params.get('session_id') || '';
    const riskType = params.get('risk_type') || '';
    const hint = document.getElementById('hint');
    if (!captchaId) { hint.textContent = '缺少验证参数'; return; }
    function fail(msg) {
      hint.textContent = msg;
      if (invoke) invoke('captcha_result', { aigis: '' }).catch(() => {});
    }
    // popup 模式：点击后弹出居中验证面板（与普通网站一致）。
    // 关键参数（参照 genshin.py 的国服实现）：
    // - userInfo: 国服 App 用 {mmt_key: session_id}（海外新 OS 才用 session_id），
    //   极验据此把本次验证与米哈游 aigis 会话绑定；缺它会「图片验证码失效」(-302)。
    // - riskType: 米哈游下发的验证形式（icon/slide），不传可能导致验证方式不符。
    const initParams = { captchaId, product: 'popup', language: 'zho' };
    if (sessionId) initParams.userInfo = JSON.stringify({ mmt_key: sessionId });
    if (riskType) initParams.riskType = riskType;
    window.initGeetest4(
      initParams,
      (captcha) => {
      captcha.appendTo(document.getElementById('box'));
      captcha.onReady(() => { hint.textContent = '请完成验证'; });
      captcha.onSuccess(() => {
        const v = captcha.getValidate();
        if (!v) { fail('验证结果为空'); return; }
        // 只保留极验 GT4 的 5 个标准字段：userInfo 等额外字段会被并入 getValidate()
        // 结果，污染 aigis，导致米哈游服务端校验失败（-302）。
        const clean = {
          captcha_id: v.captcha_id,
          lot_number: v.lot_number,
          pass_token: v.pass_token,
          gen_time: v.gen_time,
          captcha_output: v.captcha_output,
        };
        const payload = btoa(unescape(encodeURIComponent(JSON.stringify(clean))));
        const aigis = sessionId + ';' + payload;
        hint.textContent = '验证成功，正在返回…';
        if (invoke) invoke('captcha_result', { aigis }).catch(() => {});
      });
      captcha.onError(() => fail('验证出错，请关闭重试'));
      captcha.onClose(() => fail(''));
    });
  })();
  </script>
</body>
</html>
