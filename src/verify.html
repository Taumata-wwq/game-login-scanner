<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>人机验证</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #1c1c1c; color: #e4e4e4; overflow: hidden;
    font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #hint {
    position: fixed; top: 12px; left: 0; right: 0;
    text-align: center; font-size: 12px; color: #9a9a9a;
  }
  /* 容器居中，极验自行布局。 */
  #box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
  <div id="hint">请完成下方人机验证…</div>
  <div id="box"></div>
  <script>
  (function () {
    const T = window.__TAURI__;
    const invoke = T && T.core ? T.core.invoke : null;
    const params = new URLSearchParams(location.search);
    const captchaId = params.get('captcha_id') || '';
    const sessionId = params.get('session_id') || '';
    const riskType = params.get('risk_type') || '';
    const challenge = params.get('challenge') || '';
    // gt3=1 表示第三代（B站）；否则第四代（米哈游）。
    const isGt3 = params.get('gt3') === '1';
    const hint = document.getElementById('hint');
    function logx(msg) {
      if (invoke) invoke('frontend_log', { level: 'info', msg: '[极验窗口] ' + msg }).catch(() => {});
    }
    function fail(msg) {
      logx('fail: ' + msg);
      hint.textContent = msg;
      if (invoke) invoke('captcha_result', { aigis: '' }).catch(() => {});
    }
    function loadScript(src, ready, cb) {
      if (ready()) { cb(); return; }
      const s = document.createElement('script');
      s.src = src;
      s.onerror = () => fail('极验 SDK 加载失败（网络或 CSP）');
      s.onload = cb;
      document.head.appendChild(s);
    }
    const box = document.getElementById('box');

    if (isGt3) {
      // ---------- 极验第三代（B站）：gt + challenge ----------
      if (!captchaId || !challenge) { hint.textContent = '缺少验证参数'; return; }
      let done = false;
      loadScript('https://static.geetest.com/static/js/gt.0.4.9.js', () => !!window.initGeetest, () => {
        try {
          window.initGeetest(
            {
              gt: captchaId,
              challenge,
              offline: false,
              new_captcha: true,
              product: 'popup',
              lang: 'zh-cn',
              api_server: 'api.geetest.com',
            },
            (captcha) => {
              logx('GT3 captcha 就绪，gt=' + captchaId);
              captcha.appendTo(box);
              captcha.onReady(() => {
                logx('GT3 onReady');
                hint.textContent = '请完成验证';
                // onReady 后主动唤起验证面板（参考 BBH3ScanLaunch）。
                try { captcha.verify(); } catch (e) { logx('verify 异常: ' + e); }
              });
              captcha.onSuccess(() => {
                if (done) return;
                done = true;
                const v = captcha.getValidate();
                logx('GT3 onSuccess, validate=' + JSON.stringify(v));
                if (!v) { fail('验证结果为空'); return; }
                // B站格式：token|challenge|validate|seccode（token 经 sessionId 传入）。
                const res = [sessionId, v.geetest_challenge, v.geetest_validate, v.geetest_seccode].join('|');
                hint.textContent = '验证成功，正在返回…';
                if (invoke) invoke('captcha_result', { aigis: res }).catch(() => {});
              });
              captcha.onError((e) => { logx('GT3 onError: ' + JSON.stringify(e)); if (!done) fail('验证出错，请关闭重试'); });
              // 兼容：某些极验 GT3 环境完成后不触发 onSuccess，仅触发 onClose。
              // 故 onClose 时也读 getValidate()，有验证结果即视为成功。
              captcha.onClose(() => {
                if (done) return;
                const v = captcha.getValidate();
                logx('GT3 onClose, getValidate=' + JSON.stringify(v));
                if (v && v.geetest_validate) {
                  done = true;
                  const res = [sessionId, v.geetest_challenge, v.geetest_validate, v.geetest_seccode].join('|');
                  hint.textContent = '验证成功，正在返回…';
                  if (invoke) invoke('captcha_result', { aigis: res }).catch(() => {});
                } else {
                  fail('');
                }
              });
            }
          );
        } catch (e) { fail('极验初始化失败: ' + e); }
      });
      return;
    }

    // ---------- 极验第四代（米哈游）：captchaId ----------
    if (!captchaId) { hint.textContent = '缺少验证参数'; return; }
    let done4 = false;
    loadScript('https://static.geetest.com/v4/gt4.js', () => !!window.initGeetest4, () => {
      // 参数对齐米哈游通行证登录页真实初始化：product bind + hideSuccess + userInfo。
      const initParams = { captchaId, product: 'bind', language: 'zho', hideSuccess: true };
      if (sessionId) initParams.userInfo = JSON.stringify({ session_id: sessionId });
      if (riskType) initParams.riskType = riskType;
      try {
        window.initGeetest4(initParams, (captcha) => {
          captcha.appendTo(box);
          captcha.onReady(() => { hint.textContent = '请完成验证'; captcha.showCaptcha(); });
          captcha.onSuccess(() => {
            if (done4) return;
            done4 = true;
            const v = captcha.getValidate();
            if (!v) { fail('验证结果为空'); return; }
            // 只保留 GT4 的 5 个标准字段（userInfo 会污染 aigis）。
            const clean = {
              captcha_id: v.captcha_id,
              lot_number: v.lot_number,
              pass_token: v.pass_token,
              gen_time: v.gen_time,
              captcha_output: v.captcha_output,
            };
            const payload = btoa(unescape(encodeURIComponent(JSON.stringify(clean))));
            const aigis = sessionId + ';' + payload;
            hint.textContent = '验证成功，正在返回…';
            if (invoke) invoke('captcha_result', { aigis }).catch(() => {});
          });
          captcha.onError(() => { if (!done4) fail('验证出错，请关闭重试'); });
          captcha.onClose(() => { if (!done4) fail(''); });
        });
      } catch (e) { fail('极验初始化失败: ' + e); }
    });
  })();
  </script>
</body>
</html>
