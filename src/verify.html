<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>人机验证</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #1c1c1c; color: #e4e4e4; overflow: hidden;
    font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #hint { font-size: 11px; color: #9a9a9a; text-align: center; }
  /* GT4 面板标准尺寸约 300px 宽；容器留足空间并居中 */
  #box { display: flex; align-items: center; justify-content: center; min-width: 300px; min-height: 300px; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="hint">请完成下方人机验证…</div>
    <div id="box"></div>
  </div>
  <script src="https://static.geetest.com/v4/gt4.js"></script>
  <script>
  (function () {
    const T = window.__TAURI__;
    const invoke = T && T.core ? T.core.invoke : null;
    const params = new URLSearchParams(location.search);
    const captchaId = params.get('captcha_id') || '';
    const sessionId = params.get('session_id') || '';
    const hint = document.getElementById('hint');
    if (!captchaId) { hint.textContent = '缺少验证参数'; return; }
    function fail(msg) {
      hint.textContent = msg;
      if (invoke) invoke('captcha_result', { aigis: '' }).catch(() => {});
    }
    // float 模式：验证面板居中悬浮，不依赖宿主容器位置。
    window.initGeetest4({ captchaId, product: 'float', language: 'zho' }, (captcha) => {
      captcha.appendTo(document.getElementById('box'));
      captcha.onReady(() => { hint.textContent = '请完成验证'; });
      captcha.onSuccess(() => {
        const v = captcha.getValidate();
        if (!v) { fail('验证结果为空'); return; }
        const payload = btoa(unescape(encodeURIComponent(JSON.stringify(v))));
        const aigis = sessionId + ';' + payload;
        hint.textContent = '验证成功，正在返回…';
        if (invoke) invoke('captcha_result', { aigis }).catch(() => {});
      });
      captcha.onError(() => fail('验证出错，请关闭重试'));
      captcha.onClose(() => fail(''));
    });
  })();
  </script>
</body>
</html>
