<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>游戏扫码器</title>
<!-- 极验 GT4：页面加载时即引入，以采集用户行为数据（登录时动态加载会导致初始化失败） -->
<script src="https://static.geetest.com/v4/gt4.js" defer></script>
<style>
  /* ===== 设计令牌：Adobe 风格专业黑白 ===== */
  :root {
    --bg: #1c1c1c;
    --panel: #232323;
    --panel-2: #2a2a2a;
    --panel-3: #303030;
    --hover: #323232;
    --active: #3a3a3a;
    --border: #3a3a3a;
    --line: #313131;
    --text: #e4e4e4;
    --text-strong: #ffffff;
    --muted: #9a9a9a;
    --faint: #6e6e6e;
    --primary-bg: #e8e8e8;
    --primary-fg: #1a1a1a;
    --ok: #5cb075;
    --warn: #d9a94a;
    --danger: #cf4a4a;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 11px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; gap: 7px;
    height: 34px; flex: none;
    padding: 0 0 0 9px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .logo { width: 15px; height: 15px; flex: none; display: grid; place-items: center; color: var(--text-strong); }
  header h1 { font-size: 11px; font-weight: 600; margin: 0; padding-top: 2px; letter-spacing: 0.04em; color: var(--text-strong); }
  header .spacer { flex: 1; height: 100%; }
  .hbtns { display: flex; align-items: center; gap: 2px; padding-right: 5px; }

  .ibtn {
    width: 22px; height: 22px; flex: none;
    display: inline-grid; place-items: center;
    background: transparent; color: var(--muted);
    border: none; border-radius: var(--radius);
    cursor: pointer; padding: 0;
    transition: background 0.1s, color 0.1s;
  }
  .ibtn:hover { background: var(--hover); color: var(--text-strong); }
  .ibtn:active { background: var(--active); }
  .ibtn.open { color: var(--text-strong); background: var(--panel-3); }
  .ibtn svg { display: block; }
  /* 窗口控制按钮复用 .ibtn 尺寸；关闭键悬停变红。 */
  .ibtn.close:hover { background: var(--danger); color: #fff; }

  main { flex: 1; overflow: hidden; padding: 10px; display: flex; flex-direction: column; gap: 9px; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .sectitle {
    display: flex; align-items: center; gap: 7px;
    font-size: 9.5px; font-weight: 600; color: var(--faint);
    letter-spacing: 0.1em; text-transform: uppercase;
    height: 13px; flex: none; margin-top: 1px;
  }
  .sectitle::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* ===== 扫描区域（实时监视器） ===== */
  /* canvas 尺寸由 .vp-stage（16:9）控制。 */
  #previewCanvas.dragging { cursor: grabbing; }

  /* ===== 账号区 ===== */
  .filter-seg { display: flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 2px; }
  .filter-seg button {
    height: 20px; border: none; border-radius: 2px;
    background: transparent; color: var(--muted);
    font: 500 10px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 0 9px; cursor: pointer; transition: background 0.1s, color 0.1s;
  }
  .filter-seg button:hover { color: var(--text); background: var(--hover); }
  .filter-seg button.on { background: var(--primary-bg); color: var(--primary-fg); font-weight: 600; }
  /* 无边框窗口缩放热区：固定于窗口四边/四角（Tauri startResizeDragging）。 */
  .rz { position: fixed; z-index: 9999; }
  .rz-n  { top: 0; left: 0; right: 0; height: 6px; cursor: n-resize; }
  .rz-s  { bottom: 0; left: 0; right: 0; height: 6px; cursor: s-resize; }
  .rz-e  { top: 0; right: 0; bottom: 0; width: 6px; cursor: e-resize; }
  .rz-w  { top: 0; left: 0; bottom: 0; width: 6px; cursor: w-resize; }
  .rz-ne { top: 0; right: 0; width: 12px; height: 12px; cursor: ne-resize; }
  .rz-nw { top: 0; left: 0; width: 12px; height: 12px; cursor: nw-resize; }
  .rz-se { bottom: 0; right: 0; width: 12px; height: 12px; cursor: se-resize; }
  .rz-sw { bottom: 0; left: 0; width: 12px; height: 12px; cursor: sw-resize; }
  /* 添加账号：账号列表的末项（随列表滚动），与账号行同规格，
     透明底 + 虚线边框以示「可添加」而非账号本体。 */
  .acct-add {
    width: 100%; height: 27px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px dashed var(--faint); border-radius: var(--radius);
    color: var(--faint); font: inherit; cursor: pointer;
    transition: background 0.1s, border-color 0.1s, color 0.1s;
  }
  .acct-add:hover { background: var(--hover); border-color: var(--muted); color: var(--text); }

  /* 账号区自身滚动：占据剩余空间、行高不压缩；滚动条只出现在账号区内部，
     不影响上方扫描区域（overscroll-behavior 阻断滚动链，避免外层出现滚动条）。 */
  .acct-list {
    display: flex; flex-direction: column; gap: 2px;
    flex: 1 1 auto; min-height: 40px;
    overflow-y: auto; overscroll-behavior: contain;
  }
  .acct-item {
    display: flex; align-items: center; gap: 7px;
    height: 27px; flex: none; padding: 0 5px 0 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    cursor: pointer; transition: background 0.1s, border-color 0.1s;
  }
  .acct-item:hover { background: var(--hover); }
  .acct-item.on { border-color: #555555; }
  .radio {
    width: 10px; height: 10px; flex: none; border-radius: 50%;
    border: 1px solid var(--faint); background: transparent;
  }
  .acct-item.on .radio { border-color: var(--primary-bg); background: var(--primary-bg); box-shadow: inset 0 0 0 2px var(--panel); }
  .chip {
    font-size: 9.5px; font-weight: 600; flex: none;
    padding: 1px 6px; border-radius: 2px;
    background: var(--panel-3); color: var(--text);
  }
  .nm { flex: 1; min-width: 0; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acct-item.on .nm { color: var(--text-strong); font-weight: 600; }
  .remark { font-size: 10px; color: var(--faint); flex: none; max-width: 90px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acct-item.dragging { opacity: 0.5; }
  .acct-item .ibtn { width: 18px; height: 18px; visibility: hidden; }
  .acct-item:hover .ibtn { visibility: visible; }
  .acct-item .ibtn:hover { color: #ff8f8f; background: rgba(207, 74, 74, 0.12); }

  .btn {
    height: 24px; padding: 0 11px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    cursor: pointer; font: 500 11px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
    transition: background 0.1s, border-color 0.1s;
  }
  .btn:hover { background: var(--hover); border-color: #4a4a4a; }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: var(--panel-2); }
  /* 块级主按钮：整行、稍高（弹窗底部操作用）。 */
  .btn.block { width: 100%; height: 28px; }
  /* 迷你按钮：选项区「清空」等（贴近节标题）。 */
  .btn.tiny { height: 18px; font-size: 10px; padding: 0 7px; }

  /* ===== 居中弹窗 ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .overlay[hidden] { display: none; }
  .dialog {
    width: 100%; max-width: 293px; max-height: 100%;
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }
  .dhead {
    display: flex; align-items: center; gap: 6px;
    height: 30px; flex: none; padding: 0 4px 0 11px;
    border-bottom: 1px solid var(--line);
    font-size: 11px; font-weight: 600; letter-spacing: 0.03em; color: var(--text-strong);
  }
  .dhead .spacer { flex: 1; }
  .dbody { padding: 10px 11px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 8px; }
  .dsec {
    display: flex; align-items: center; gap: 6px;
    font-size: 9.5px; font-weight: 600; color: var(--faint);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .dsec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .dsec .btn { margin-left: auto; }
  .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .opt-row .lbl { font-size: 11px; flex: 0 0 auto; }
  /* 设置区内的登入名输入框：占据行内剩余空间。 */
  .opt-row #displayName { flex: 1 1 auto; min-width: 0; max-width: 170px; height: 24px; }
  .opt-row .lbl small { display: block; color: var(--faint); font-size: 9.5px; margin-top: 1px; }
  .switch { position: relative; width: 30px; height: 17px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--border);
    transition: background 0.12s, border-color 0.12s; cursor: pointer;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 11px; height: 11px; border-radius: 50%; background: var(--faint);
    transition: transform 0.12s, background 0.12s;
  }
  .switch input:checked + .track { background: var(--primary-bg); border-color: var(--primary-bg); }
  .switch input:checked + .track::after { transform: translateX(13px); background: #1a1a1a; }
  /* 文本输入框统一样式（.txtin 与弹窗内 field-row input 共用）。
     弹窗内输入框撑满整行。 */
  .txtin, .field-row input {
    width: 100%; height: 24px; padding: 0 8px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    outline: none; font: inherit;
  }
  .txtin:focus, .field-row input:focus { border-color: #8a8a8a; }
  .txtin.full { width: 100%; }
  /* 分段控件（登录方式页签）。 */
  .seg3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 2px; }
  /* B站仅两页签（二维码 / 密码）时，改为二等分。 */
  .seg3.two { grid-template-columns: 1fr 1fr; }
  .seg3 button {
    height: 22px; border: none; border-radius: 2px;
    background: transparent; color: var(--muted);
    font: 500 10.5px/1 "Segoe UI", "Microsoft YaHei", sans-serif;
    cursor: pointer; transition: background 0.1s, color 0.1s;
  }
  .seg3 button:hover { color: var(--text); background: var(--hover); }
  .seg3 button.on { background: var(--primary-bg); color: var(--primary-fg); font-weight: 600; }
  .seg3 button[hidden] { display: none; }
  .field-row { display: flex; flex-direction: column; gap: 4px; }
  .field-row .flbl { font-size: 10px; color: var(--faint); }
  /* 验证码行：输入框占满剩余宽度，按钮等宽；两者等高对齐。 */
  .code-row { display: flex; gap: 6px; align-items: stretch; }
  .code-row input { flex: 1 1 auto; min-width: 0; height: 24px; }
  .code-row button { flex: 0 0 76px; height: 24px; padding: 0; font-size: 10px; }
  /* 双二维码并排 */
  .qr-page { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 2px 0; }
  .qr-page[hidden] { display: none; }
  .qr-label { font-size: 9.5px; color: var(--muted); font-weight: 600; }
  .qr-img {
    width: 100%; aspect-ratio: 1 / 1; max-width: 176px; padding: 4px;
    background: #fff; border-radius: var(--radius);
  }
  .qr-img svg { width: 100%; height: 100%; display: block; }
  .qr-img:empty { background: var(--panel-2); }
  .qr-status { font-size: 9.5px; color: var(--muted); text-align: center; }
  .qr-status.scanned { color: var(--warn); }
  .qr-status.expired { color: var(--danger); }
  .qr-status.confirmed { color: var(--ok); }
  /* 日志 */
  #log {
    min-height: 100px; max-height: 170px; overflow-y: auto; margin: 0;
    padding: 7px 9px;
    background: #181818;
    border: 1px solid var(--line); border-radius: var(--radius);
    font: 10.5px/1.7 Consolas, "Courier New", monospace;
    color: var(--muted);
    user-select: text;
  }
  #log .success { color: var(--ok); }
  #log .error { color: #e07a7a; }
  #log .info { color: var(--muted); }
  #log .time { color: #5a5a5a; margin-right: 6px; }

  /* 隐藏全部滚动条（保留滚动能力）：列表/日志区内容超出时不再显示滚动条占据宽度，
     滚轮与拖拽滚动照常工作。scrollbar-width 覆盖标准实现，::-webkit-scrollbar
     覆盖 Chromium 旧路径（WebView2 两套并存时任一命中即不渲染）。 */
  * { scrollbar-width: none; }
  ::-webkit-scrollbar { width: 0; height: 0; display: none; }

  /* ===== 横版布局骨架（阶段1）===== */
  .app { flex: 1; display: flex; min-height: 0; }
  /* 左栏：标题（标题栏）+ 直播间/桌面列表。 */
  .sidebar {
    width: 208px; flex: none; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  /* 标题栏仅在左栏上方；右栏无标题栏（可拖拽移动窗口）。 */
  .sidebar header {
    display: flex; align-items: center; gap: 7px;
    height: 34px; flex: none; padding: 0 4px 0 9px;
    border-bottom: 1px solid var(--line);
  }
  .sidebar header .logo { width: 15px; height: 15px; flex: none; display: grid; place-items: center; color: var(--text-strong); }
  /* 标题可收缩（min-width:0 才能省略号），按钮不可收缩——避免窄栏时按钮被挤出。 */
  .sidebar header h1 { font-size: 11px; font-weight: 600; margin: 0; letter-spacing: 0.04em; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
  .sidebar header .spacer { flex: 0 1 0; min-width: 4px; height: 100%; }
  .sidebar header .hbtns { flex: none; }
  /* 直播间/桌面列表：滚动区。 */
  .room-list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 3px; padding: 6px;
  }
  /* 卡片：封面缩略图 + 文本信息。 */
  .room-card {
    display: flex; gap: 7px; align-items: center;
    padding: 5px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel-2); cursor: pointer; user-select: none;
    transition: background 0.1s, border-color 0.1s;
  }
  .room-card:hover { background: var(--hover); }
  .room-card.on { border-color: var(--primary-bg); background: var(--panel-3); }
  .room-card.dragging { opacity: 0.45; }
  .room-card .thumb {
    width: 48px; height: 30px; flex: none; border-radius: 2px; overflow: hidden;
    background: #101010; display: grid; place-items: center;
  }
  .room-card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .room-card .thumb .ph { color: var(--faint); }
  .room-card .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .room-card .rname { font-size: 10.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-card .rsub { font-size: 9px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 状态徽标：固定宽度 + 不换行（文案仅在 直播中/识别中/已确认/未开播 间切换）。 */
  .room-card .st { flex: none; width: 38px; text-align: center; white-space: nowrap; font-size: 8.5px; font-weight: 700; padding: 1px 0; border-radius: 2px; }
  .st.live { background: rgba(92,176,117,0.18); color: var(--ok); }
  .st.off { background: var(--panel-3); color: var(--faint); }
  .st.scan { background: rgba(217,169,74,0.2); color: var(--warn); }
  .st.done { background: rgba(92,176,117,0.35); color: #b8f0c8; }
  .room-add {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    height: 28px; flex: none; margin-top: 2px;
    background: transparent; border: 1px dashed var(--faint); border-radius: var(--radius);
    color: var(--faint); font: inherit; font-size: 10.5px; cursor: pointer;
  }
  .room-add:hover { background: var(--hover); color: var(--text); border-color: var(--muted); }

  /* 右栏：上视窗 + 下账号区。 */
  .main-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  /* 视窗区：占上部，含信息栏 + canvas + 底部操作条。 */
  /* 视窗区：高度由 JS 按 16:9 适配计算（不 grow/shrink，避免与账号区争抢）。 */
  .viewport { flex: 0 0 auto; display: flex; flex-direction: column; background: #101010; }
  .vp-info {
    display: flex; align-items: center; gap: 8px; flex: none;
    height: 34px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    font-size: 10px; color: var(--muted);
  }
  .vp-info .ttl { color: var(--text-strong); font-weight: 600; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vp-info .sep { color: var(--faint); }
  .vp-info .spacer { flex: 1; }
  /* 顶部状态徽标：固定宽度（防被标题挤压换行）。 */
  .vp-info .badge { flex: none; width: 46px; text-align: center; white-space: nowrap; font-size: 9px; font-weight: 700; padding: 1px 0; border-radius: 2px; background: var(--panel-3); color: var(--muted); }
  .vp-info .badge.live { background: rgba(92,176,117,0.18); color: var(--ok); }
  /* 视窗适配容器：尺寸由 JS 设置（16:9 适配结果），居中放置 stage。 */
  .vp-fit { flex: 0 0 auto; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  /* 16:9 视窗：尺寸由 JS 按 16:9 在容器内等比适配（letterbox），不变形。 */
  .vp-stage { position: relative; background: #0c0c0c; overflow: hidden; }
  .vp-stage canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .vp-stage canvas.dragging { cursor: grabbing; }
  /* 画面上浮控件：fps 左上、重置右上。 */
  .vp-stage .fps {
    position: absolute; left: 6px; top: 6px; z-index: 5;
    height: 20px; padding: 0 6px; display: grid; place-items: center;
    background: rgba(20,20,20,0.75); border: 1px solid var(--border); border-radius: var(--radius);
    font: 10px/1 Consolas, monospace; color: #9fe0a0; cursor: pointer; user-select: none;
  }
  .vp-stage .fps.paused { color: #e0a09f; }
  .vp-stage .region-reset {
    position: absolute; right: 6px; top: 6px; z-index: 5;
    width: 20px; height: 20px; display: grid; place-items: center;
    background: rgba(20,20,20,0.75); color: #cfcfcf; border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; padding: 0;
  }
  .vp-stage .region-reset:hover { background: var(--hover); color: var(--text-strong); }
  /* 账号区：占剩余空间。 */
  /* 账号区：保最小高度（窗口变小时由上方视窗压缩让位）。 */
  .acct-area { flex: 1 1 auto; min-height: 120px; display: flex; padding: 8px 10px 10px; gap: 8px; }
  /* 左列游戏选择（阶段4 填充）。 */
  .game-col {
    width: 125px; flex: none; display: flex; flex-direction: column; gap: 3px;
    overflow-y: auto; overscroll-behavior: contain;
  }
  .game-col .gitem {
    height: 27px; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); cursor: pointer; font-size: 11px; color: var(--muted);
    display: flex; align-items: center; gap: 4px; flex: none;
  }
  .game-col .gitem:hover { background: var(--hover); color: var(--text); }
  .game-col .gitem.on { border-color: var(--primary-bg); color: var(--text-strong); font-weight: 600; }

  });

  // ---------- 账号渲染 ----------
  // 当前游戏 id（账号按游戏独立存储；旧数据 game 为空时归入崩坏3）。
  function curGameId() { return config ? (config.current_game || 'bh3') : 'bh3'; }
  function acctGame(t) { return t.game; }
  function accountsAll() {
    if (!config) return [];
    const g = curGameId();
    const out = [];
    // 保留配置中的存储顺序（用户可拖拽调整），不再按使用时间排序。
    (config.bili_accounts || []).forEach((t) => { if (acctGame(t) === g) out.push({ ch: 'bilibili', t }); });
    (config.official_accounts || []).forEach((t) => { if (acctGame(t) === g) out.push({ ch: 'official', t }); });
    (config.hypergryph_accounts || []).forEach((t) => { if (acctGame(t) === g) out.push({ ch: 'hypergryph', t }); });
    return out;
  }
  // 当前游戏下某渠道的激活账号标识（active_* 现为 { game: id } 映射）。
  function activeUidOf(ch) {
    if (!config) return null;
    const g = curGameId();
    if (ch === 'bilibili') return (config.active_bili || {})[g];
    if (ch === 'hypergryph') return (config.active_hypergryph || {})[g];
    return (config.active_official || {})[g];
  }
  // 鹰角账号以 phone 作标识；其余以 uid。
  function acctKey(ch, t) { return ch === 'hypergryph' ? t.phone : t.uid; }
  // 是否「当前账号」：该游戏该渠道的激活标识匹配。
  function isCurrentAccount(ch, key) {
    if (!config) return false;
    const g = curGameId();
    if (ch === 'hypergryph') return (config.active_hypergryph || {})[g] === key;
    const curCh = (config.game_channel || {})[g];
    return curCh === ch && activeUidOf(ch) === key;
  }
  function accountName(ch, t) {
    if (ch === 'hypergryph') {
      const base = t.phone || '未知';
      return t.alias ? (t.alias + '（' + base + '）') : base;
    }
    const base = ch === 'bilibili' ? (t.uname || 'UID ' + t.uid) : (t.uname || 'uid ' + t.uid);
    // 有备注名时显示「备注名（原名）」。
    return t.alias ? (t.alias + '（' + base + '）') : base;
  }
  function channelLabel(ch) {
    if (ch === 'hypergryph') return '鹰角';
    if (ch === 'official') return '官服';
    return 'B 服';
  }

  // ---------- 游戏（多游戏支持） ----------
  // 各游戏共享同一批账号（同一米游社/B站账号可登录米哈游全系游戏）；
  // 切换游戏只改变扫描确认时使用的 biz_key 与协议端点。
  const GAMES = [
    { id: 'bh3', name: '崩坏3', vendor: 'mihoyo', desc: '官服 / B服', official: true, bili: true, hyper: false },
    { id: 'hsr', name: '崩坏：星穹铁道', vendor: 'mihoyo', desc: '官服 / B服', official: true, bili: true, hyper: false },
    { id: 'genshin', name: '原神', vendor: 'mihoyo', desc: '官服 / B服', official: true, bili: true, hyper: false },
    { id: 'zzz', name: '绝区零', vendor: 'mihoyo', desc: '官服 / B服', official: true, bili: true, hyper: false },
    { id: 'endfield', name: '明日方舟：终末地', vendor: 'hypergryph', desc: '鹰角账号', official: false, bili: false, hyper: true },
    { id: 'arknights', name: '明日方舟', vendor: 'hypergryph', desc: '鹰角账号', official: false, bili: false, hyper: true },
  ];
  function gameMeta(id) { return GAMES.find((g) => g.id === id) || GAMES[0]; }
  function gameLabel(id) { return gameMeta(id).name; }
  function vendorOf(id) { const g = gameMeta(id); return g.vendor; }
  // 游戏选择列（左列）：直接列全部游戏，点击切换。
  function renderGame() {
    if (!config) return;
    const col = $('gameCol');
    if (!col) return;
    col.textContent = '';
    const cur = config.current_game || 'bh3';
    for (const g of GAMES) {
      const it = document.createElement('div');
      it.className = 'gitem' + (g.id === cur ? ' on' : '');
      const nm = document.createElement('span');
      nm.textContent = g.name;
      it.appendChild(nm);
      it.addEventListener('click', () => switchGame(g.id));
      col.appendChild(it);
    }
  }
  async function switchGame(id) {
    if (!config || config.current_game === id) return;
    try {
      await invoke('switch_game', { game: id });
      config = await invoke('get_config');
    } catch (e) {
      log('切换游戏失败: ' + e, 'error');
      return;
    }
    // 恢复目标游戏上次的渠道；不支持时由 renderFilter 回退。
    const g = gameMeta(id);
    const saved = (config.game_channel || {})[id];
    if (g.hyper) filter = 'hypergryph';
    else if (saved) filter = saved;
    renderGame();
    renderAll();
    log('已切换到 ' + gameLabel(id), 'info');
  }

  function renderFilter() {
    const g = gameMeta(config ? (config.current_game || 'bh3') : 'bh3');
    // 先回退 filter 到该游戏支持的渠道，再渲染高亮——否则切换游戏时高亮会先投给
    // 即将被隐藏的旧渠道，导致当前无任何按钮高亮（直到下次渲染）。
    if (g.hyper) {
      if (filter !== 'hypergryph') filter = 'hypergryph';
    } else {
      if (filter === 'hypergryph') filter = 'official';
      if (filter === 'bilibili' && !g.bili) filter = 'official';
      if (filter === 'official' && !g.official) filter = 'bilibili';
    }
    document.querySelectorAll('#filterSeg button').forEach((b) => {
      const f = b.dataset.f;
      const supported = f === 'bilibili' ? g.bili : (f === 'official' ? g.official : g.hyper);
      b.hidden = !supported;
      b.classList.toggle('on', f === filter && supported);
    });
  }

  function renderAccounts() {
    const list = $('acctList');
    list.textContent = '';
    const rows = accountsAll().filter((a) => a.ch === filter);
    rows.forEach(({ ch, t }, idx) => {
      const key = acctKey(ch, t);
      const row = document.createElement('div');
      const isCurrent = isCurrentAccount(ch, key);
      row.className = 'acct-item' + (isCurrent ? ' on' : '');
      row.draggable = true;
      row.dataset.uid = key;
      row.dataset.ch = ch;
      row.dataset.idx = idx;
      // 选中按钮：仅点击它才切换当前账号。
      const radio = document.createElement('span');
      radio.className = 'radio';
      radio.title = '设为当前账号';
      radio.addEventListener('click', (e) => { e.stopPropagation(); selectAccount(ch, key); });
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = channelLabel(ch);
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = accountName(ch, t);
      nm.title = '双击修改备注';
      // 右侧备注（无则为空）。
      const remark = document.createElement('span');
      remark.className = 'remark';
      remark.textContent = t.remark || '';
      remark.title = t.remark || '';
      const del = document.createElement('button');
      del.className = 'ibtn';
      del.title = '删除该账号';
      del.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      del.addEventListener('click', (e) => { e.stopPropagation(); deleteAccount(ch, key); });
      row.append(radio, chip, nm, remark, del);
      // 双击行（非按钮/选中点）→ 编辑备注（内部弹窗）。
      row.addEventListener('dblclick', (e) => {
        if (e.target.closest('.radio') || e.target.closest('.ibtn')) return;
        openRemarkDialog(ch, key);
      });
      // 拖拽排序。
      row.addEventListener('dragstart', (e) => {
        dragUid = key;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      row.addEventListener('dragend', () => { dragUid = null; row.classList.remove('dragging'); renderAccounts(); });
      row.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!dragUid || dragUid === key) return;
        reorderAccounts(ch, dragUid, key);
      });
      list.appendChild(row);
    });
    // 「添加账号」作为列表末项（与账号同级、随列表滚动；不参与拖拽排序）。
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'acct-add';
    add.textContent = '＋ 添加账号';
    add.title = '添加账号';
    add.addEventListener('click', () => {
      if (filter === 'hypergryph') {
        $('hyperPhone').value = '';
        $('hyperCode').value = '';
        $('hyperStatus').textContent = '';
        $('hyperOverlay').hidden = false;
        $('hyperPhone').focus();
        return;
      }
      openLogin();
    });
    list.appendChild(add);
  }

  // 拖拽排序：把 dragUid 移到 targetUid 位置并保存。
  let dragUid = null;
  async function reorderAccounts(ch, dragUid, targetUid) {
    if (ch === 'hypergryph') {
      // 仅重排当前游戏的鹰角账号：交给后端（按 game 过滤），避免前端在混合全量
      // 数组上重排而打乱其它游戏排序。
      const game = curGameId();
      const mine = (config.hypergryph_accounts || []).filter((a) => a.game === game);
      const order = mine.map((a) => a.phone);
      const from = order.indexOf(dragUid);
      const to = order.indexOf(targetUid);
      if (from < 0 || to < 0) return;
      order.splice(from, 1);
      order.splice(to, 0, dragUid);
      await invoke('hypergryph_reorder', { game, order });
      config = await invoke('get_config');
      renderAccounts();
      return;
    }
    const order = (ch === 'bilibili' ? config.bili_accounts : config.official_accounts).map((a) => a.uid);
    const from = order.indexOf(dragUid);
    const to = order.indexOf(targetUid);
    if (from < 0 || to < 0) return;
    order.splice(from, 1);
    order.splice(to, 0, dragUid);
    try {
      await invoke('reorder_accounts', { game: curGameId(), channel: ch, order });
      config = await invoke('get_config');
      renderAccounts();
    } catch (e) { log('调整顺序失败: ' + e, 'error'); }
  }

  // 双击行编辑备注名 + 备注信息（内部弹窗）。
  let remarkTarget = null;   // { ch, uid }
  function openRemarkDialog(ch, uid) {
    const arr = ch === 'bilibili' ? config.bili_accounts
              : (ch === 'hypergryph' ? config.hypergryph_accounts : config.official_accounts);
    const g = curGameId();
    const t = (arr || []).find((a) =>
      (ch === 'hypergryph' ? a.phone : a.uid) === uid && acctGame(a) === g);
    if (!t) return;
    remarkTarget = { ch, uid };
    $('remarkAlias').value = t.alias || '';
    $('remarkText').value = t.remark || '';
    $('remarkOverlay').hidden = false;
    $('remarkAlias').focus();
  }
  function closeRemarkDialog() { $('remarkOverlay').hidden = true; remarkTarget = null; }
  async function saveRemarkDialog() {
    if (!remarkTarget) return;
    const { ch, uid } = remarkTarget;
    const alias = $('remarkAlias').value.trim();
    const remark = $('remarkText').value.trim();
    try {
      const game = curGameId();
      if (ch === 'hypergryph') {
        await invoke('hypergryph_set_meta', { game, phone: uid, alias, remark });
      } else {
        await invoke('set_account_meta', { game, channel: ch, uid, alias, remark });
      }
      config = await invoke('get_config');
      closeRemarkDialog();
      renderAccounts();
    } catch (e) { log('保存备注失败: ' + e, 'error'); }
  }

  // 设置项更新：走字段级命令（不整份回写配置），避免与账号类命令并发互相覆盖。
  // patch 的键名与 set_options 参数一致（蛇形→驼峰转换）。
  async function saveCfg(patch) {
    config = Object.assign({}, config, patch);
    const args = {};
    if ('auto_login_last' in patch) args.autoLoginLast = patch.auto_login_last;
    if ('always_on_top' in patch) args.alwaysOnTop = patch.always_on_top;
    if ('auto_close' in patch) args.autoClose = patch.auto_close;
    if ('display_fps' in patch) args.displayFps = patch.display_fps;
    if ('display_name' in patch) args.displayName = patch.display_name;
    await invoke('set_options', args);
  }

  async function selectAccount(ch, uid) {
    try {
      const game = curGameId();
      if (ch === 'hypergryph') {
        await invoke('hypergryph_select', { game, phone: uid });
      } else {
        await invoke('select_account', { game, channel: ch, uid });
      }
      config = await invoke('get_config');
      log('已切换到 ' + channelLabel(ch) + ' 账号 ' + uid, 'info');
      renderAll();
    } catch (e) {
      log('切换账号失败: ' + e, 'error');
    }
  }

  async function deleteAccount(ch, uid) {
    try {
      const game = curGameId();
      if (ch === 'hypergryph') {
        await invoke('hypergryph_delete', { game, phone: uid });
      } else {
        await invoke('delete_account', { game, channel: ch, uid });
      }
      config = await invoke('get_config');
      log('已删除 ' + channelLabel(ch) + ' 账号 ' + uid, 'info');
      renderAll();
    } catch (e) {
      log('删除账号失败: ' + e, 'error');
    }
  }

  // ---------- 统一登录弹窗（二维码 / 验证码 / 密码） ----------
  const $qrImg = $('addQrImg');
  const $qrLabel = $('addQrLabel');
  let qrActive = false;
  let pollTimer = null;
  let pollFails = 0;
  let qrStartSeq = 0;
  let qrAutoRetry = 0;
  // 扫码登录轮询间隔：等待扫码时 1.5s（保守，与官方前端同量级，控制风控面）；
  // 检测到「已扫码」后提速到 450ms——手机随时可能点确认，固定 1.5s 会让
  // 「确认 → 桌面显示成功」多等一个整间隔。自适应后该延迟最高省 ~1s。
  let qrPollDelay = 1500;

  function qrChannelLabel(ch) {
    return ch === 'official' ? '官服 · 米游社 App 扫码' : 'B 服 · B 站 App 扫码';
  }
  function setQrStatus(text, cls) {
    const el = $('credStatus');
    el.textContent = text;
    el.className = 'qr-status' + (cls ? ' ' + cls : '');
  }
  function stopPolling() { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }

  async function startQrLogin() {
    if (qrActive) return;
    const ch = filter;
    const seq = ++qrStartSeq;
    qrActive = true;
    pollFails = 0;
    qrPollDelay = 1500;
    $qrLabel.textContent = qrChannelLabel(ch);
    $qrImg.innerHTML = '';
    setQrStatus('生成中…', '');
    $('btnQrRefresh').style.display = 'none';
    try {
      const [, svg] = await invoke('login_qr_start', { channel: ch });
      if (seq !== qrStartSeq) { invoke('login_qr_cancel').catch(() => {}); return; }
      $qrImg.innerHTML = svg;
      setQrStatus('等待扫码…', '');
      log('已生成' + (ch === 'official' ? '官服' : 'B 服') + '登录二维码（180 秒内有效）', 'info');
      pollLoop();
    } catch (e) {
      if (seq !== qrStartSeq) return;
      qrActive = false;
      setQrStatus('生成失败', 'expired');
      $('btnQrRefresh').style.display = '';
      log('生成二维码失败: ' + e, 'error');
    }
  }

  function pollLoop() {
    stopPolling();
    pollTimer = setTimeout(async () => {
      if (!qrActive) return;
      let r;
      try {
        r = await invoke('login_qr_poll');
        pollFails = 0;
      } catch (e) {
        if (String(e).includes('没有进行中的扫码登录')) { qrActive = false; return; }
        pollFails++;
        if (pollFails >= 8) {
          qrActive = false;
          setQrStatus('网络异常，请点「重新生成」', 'expired');
          $('btnQrRefresh').style.display = '';
          log('扫码登录轮询连续失败: ' + e, 'error');
          return;
        }
        pollLoop();
        return;
      }
      const [status, channel, uid, name] = r;
      if (status === 'waiting') {
        setQrStatus($qrImg.innerHTML ? '等待扫码…' : '生成中…', '');
        qrPollDelay = 1500;
        pollLoop();
      } else if (status === 'scanned') {
        setQrStatus('已扫码，请在手机上确认', 'scanned');
        qrPollDelay = 450; // 已扫码：确认随时到达，提速轮询（见 qrPollDelay 注释）
        pollLoop();
      } else if (status === 'expired') {
        qrAutoRetry++;
        if (qrAutoRetry <= 3) {
          setQrStatus('已过期，重新生成…', 'expired');
          stopPolling();
          qrActive = false;
          startQrLogin();
        } else {
          setQrStatus('多次过期，请手动重新生成', 'expired');
          $('btnQrRefresh').style.display = '';
        }
      } else if (status === 'confirmed') {
        setQrStatus('登录成功', 'confirmed');
        try { config = await invoke('get_config'); } catch (e) {}
        qrActive = false;
        invoke('login_qr_cancel').catch(() => {});
        renderAll();
        log(channelLabel(channel) + '扫码登录成功' + (name ? '：' + name : ''), 'success');
        setTimeout(() => { $('loginOverlay').hidden = true; }, 800);
      }
    }, qrPollDelay);
  }

  function cancelQr() {
    stopPolling();
    if (qrActive) {
      qrActive = false;
      invoke('login_qr_cancel').catch(() => {});
      log('已取消扫码登录', 'info');
    }
  }

  // ---------- 统一登录弹窗：验证码 / 密码 ----------
  let loginMode = 'qr';   // qr | sms | pwd
  let credCodeTimer = null;
  function setCredStatus(t) { $('credStatus').textContent = t; }

  // 切换登录方式页签。
  function switchLoginMode(mode) {
    loginMode = mode;
    document.querySelectorAll('#loginModeSeg button').forEach((b) => {
      b.classList.toggle('on', b.dataset.mode === mode);
    });
    $('loginQrPage').hidden = mode !== 'qr';
    $('loginSmsPage').hidden = mode !== 'sms';
    $('loginPwdPage').hidden = mode !== 'pwd';
    $('btnQrRefresh').style.display = mode === 'qr' ? '' : 'none';
    $('btnCredLogin').style.display = mode === 'qr' ? 'none' : '';
    setCredStatus('');
    if (mode === 'qr') {
      qrAutoRetry = 0;
      pollFails = 0;
      startQrLogin();
    } else {
      cancelQr();
    }
  }

  // 打开统一登录弹窗（默认二维码）。
  function openLogin() {
    $('loginTitle').textContent = (filter === 'official' ? '官服' : 'B 服') + '账号登录';
    $('credPhone').value = ''; $('credCode').value = '';
    $('credAccount').value = ''; $('credPassword').value = '';
    $('loginOverlay').hidden = false;
    // B站不支持短信登录（风控限制），隐藏验证码页签；仅保留二维码与密码。
    const isBili = filter === 'bilibili';
    document.querySelectorAll('#loginModeSeg button').forEach((b) => {
      if (b.dataset.mode === 'sms') b.hidden = isBili;
    });
    // B站仅两页签，改二等分。
    $('loginModeSeg').classList.toggle('two', isBili);
    switchLoginMode('qr');
  }

  document.querySelectorAll('#loginModeSeg button').forEach((b) => {
    b.addEventListener('click', () => switchLoginMode(b.dataset.mode));
  });
  function credCountdown() {
    const btn = $('btnCredSend');
    let left = 60;
    btn.disabled = true; btn.style.opacity = '0.55'; btn.textContent = left + 's';
    credCodeTimer = setInterval(() => {
      left--;
      if (left <= 0) {
        clearInterval(credCodeTimer); credCodeTimer = null;
        btn.disabled = false; btn.style.opacity = ''; btn.textContent = '发送验证码';
      } else { btn.textContent = left + 's'; }
    }, 1000);
  }
  async function doSendCode(aigis) {
    return invoke('cred_send_code', { channel: filter, phone: $('credPhone').value.trim(), aigis: aigis || '' });
  }
  $('btnCredSend').addEventListener('click', async () => {
    if (credCodeTimer) return;
    const phone = $('credPhone').value.trim();
    if (!phone) { setCredStatus('请输入手机号'); return; }
    setCredStatus('发送中…');
    try {
      const r = await doSendCode('');
      if (r && r.status === 'captcha') {
        setCredStatus('需要人机验证');
        showCaptcha(r.aigis, (aigis) => {
          setCredStatus('发送中…');
          doSendCode(aigis).then((r2) => {
            if (r2 && r2.status === 'captcha') { setCredStatus('需再次验证，请关闭后重试'); return; }
            setCredStatus('验证码已发送');
            credCountdown();
          }).catch((e) => setCredStatus('发送失败: ' + e));
        });
        return;
      }
      setCredStatus('验证码已发送');
      credCountdown();
    } catch (e) { setCredStatus('发送失败: ' + e); }
  });
  async function doCredLogin(aigis) {
    const game = curGameId();
    if (loginMode === 'sms') {
      const phone = $('credPhone').value.trim();
      const code = $('credCode').value.trim();
      return invoke('cred_login_sms', { channel: filter, game, phone, code, aigis: aigis || '' });
    }
    const account = $('credAccount').value.trim();
    const password = $('credPassword').value;
    return invoke('cred_login_pwd', { channel: filter, game, account, password, aigis: aigis || '' });
  }

  $('btnCredLogin').addEventListener('click', async () => {
    setCredStatus('登录中…');
    try {
      if (loginMode === 'sms') {
        if (!$('credPhone').value.trim() || !$('credCode').value.trim()) { setCredStatus('请填写手机号和验证码'); return; }
      } else {
        if (!$('credAccount').value.trim() || !$('credPassword').value) { setCredStatus('请填写账号和密码'); return; }
      }
      const r = await doCredLogin('');
      if (r && r.status === 'captcha') {
        setCredStatus('需要人机验证');
        showCaptcha(r.aigis, (aigis) => {
          setCredStatus('验证通过，正在登录…');
          doCredLogin(aigis).then((r2) => {
            if (r2 && r2.status === 'captcha') { setCredStatus('需再次验证，请关闭后重试'); return; }
            onCredSuccess();
          }).catch((e) => setCredStatus('登录失败: ' + e));
        });
        return;
      }
      onCredSuccess();
    } catch (e) { setCredStatus('登录失败: ' + e); }

  function onCredSuccess() {

  // ---------- 人机验证（极验 GT3，独立弹窗） ----------
  // 米哈游极验：aigis = { session_id, data: { gt, risk_type, ... } }。
  // 打开独立验证窗口（verify.html），窗口完成后经 captcha_result 命令写回，
  // 前端轮询 take_captcha_result 取回 "session_id;base64(getValidate())" 并重试。
  let captchaRetry = null;   // 验证完成后重试的回调
  let captchaTimer = null;   // 轮询验证结果的 interval（模块级：防重复叠加）
  async function showCaptcha(aigis, retryFn) {
    let data = aigis && aigis.data !== undefined ? aigis.data : aigis;
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch (e) { data = {}; }
    }
    if (!data || typeof data !== 'object') data = {};
    const sid = aigis && aigis.session_id ? aigis.session_id : '';
    const gt = data.gt || '';
    const challenge = data.challenge || '';
    // B站游戏 SDK 极验：{gt, challenge, userid}（无 session_id）；
    // 米哈游 GT4：{captcha_id/session_id}。
    const isGt3 = !!(gt && challenge && !sid);
    // B站把 userid 放在 session_id 通道传给窗口；GT3 完成后回传
    // JSON {challenge, userid, validate}。
    const biliUserId = data.userid || data.gt_user_id || '';
    const captchaId = data.captcha_id || data.captchaId || gt;
    const riskType = data.risk_type || data.riskType || '';
    if (!captchaId) {
      if (retryFn) retryFn(''); else setCredStatus('验证参数缺失');
      return;
    }
    captchaRetry = retryFn;
    // 清理可能残留的旧轮询（重复调用时防止叠加多个 interval 与结果串扰）。
    if (captchaTimer !== null) { clearInterval(captchaTimer); captchaTimer = null; }
    setCredStatus('请在弹出的验证窗口中完成验证…');
    try {
      await invoke('open_captcha_window', {
        captchaId,
        sessionId: isGt3 ? biliUserId : sid,
        riskType,
        challenge: isGt3 ? challenge : '',
        gt3: isGt3,
      });
    } catch (e) {
      setCredStatus('打开验证窗口失败: ' + e);
      return;
    }
    // 轮询取回验证结果（窗口通过 captcha_result 命令写回）。
    // 注意：后端持续报错或用户直接关窗（不触发 captcha_result）时也必须终止轮询，
    // 故 catch 分支累计失败次数、超上限即停止（此前 catch return 会永久轮询）。
    let pollFails = 0;
    captchaTimer = setInterval(async () => {
      let res;
      try {
        res = await invoke('take_captcha_result');
        pollFails = 0;
      } catch (e) {
        pollFails += 1;
        if (pollFails >= 25) { // ~10s 无响应：视为窗口已关闭，停止轮询
          clearInterval(captchaTimer);
          captchaTimer = null;
          captchaRetry = null;
          setCredStatus('验证窗口无响应，已取消');
        }
        return;
      }
      if (res === null || res === undefined) return;
      clearInterval(captchaTimer);
      captchaTimer = null;
      const fn = captchaRetry;
      captchaRetry = null;
      if (res) {
        log('极验结果: ' + res, 'info');
        setCredStatus('验证通过，正在继续…');
        if (fn) fn(res);
      } else {
        log('极验结果为空（用户取消或验证失败）', 'error');
        setCredStatus('验证已取消');
      }
    }, 400);
  }

  // ---------- 扫描区域（实时监视器） ----------
  let srcCanvas = null;
  let prevRegionStr = null;
  let previewTimer = null;
  let previewErrShown = false;
  // 画布内容是否已被清空（尺寸重建 / 强制重栅格化）：供 drawView 的冻结守卫
  // 放行一次兜底绘制，避免「画布已清空 + 冻结」组合下整屏保持黑色。
  let canvasBlank = false;
  const canvas = $('previewCanvas');
  // 缓存 2D 上下文（getContext 每帧调用有查找开销）。
  const canvasCtx = canvas.getContext('2d');

  // 视窗布局：按 16:9 在「主列宽度」与「扣除信息栏+账号区最小高度后的可用高度」中取小，
  // 等比适配（letterbox），绝不拉伸变形。账号区保留 min 120px。
  const ACCT_MIN_H = 120;
  const VP_INFO_H = 34;
  function layoutViewport() {
    const main = document.querySelector('.main-col');
    const fit = $('vpFit'), stage = $('vpStage');
    if (!main || !fit || !stage) return;
    const mainW = main.clientWidth;
    const mainH = main.clientHeight;
    if (mainW <= 0 || mainH <= 0) return;
    const availH = Math.max(60, mainH - VP_INFO_H - ACCT_MIN_H);
    const ar = 16 / 9;
    let w = mainW, h = mainW / ar;
    if (h > availH) { h = availH; w = availH * ar; }
    w = Math.round(w); h = Math.round(h);
    if (stage.style.width !== w + 'px') stage.style.width = w + 'px';
    if (stage.style.height !== h + 'px') stage.style.height = h + 'px';
    if (fit.style.height !== h + 'px') fit.style.height = h + 'px';
  }

  function sizeCanvasToDisplay() {
    layoutViewport();
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    let w = Math.round(Math.min(Math.max((rect.width || 480) * dpr, 320), 4096));
    w -= w % 4;
    const h = Math.round((w / 16) * 9);
    if (w !== canvas.width || h !== canvas.height) {
      canvas.width = w;
      canvas.height = h;
      // 改 width/height 会清空画布内容。若此时恰逢底图冻结守卫（见 drawView），
      // 不重绘就会整屏保持黑——标记「画布为空」让守卫放行一次兜底绘制。
      canvasBlank = true;
    }
  }
  sizeCanvasToDisplay();
  window.addEventListener('resize', () => sizeCanvasToDisplay());
  const canvasWrap = canvas.parentElement;
  let settleTimer = null;
  function forceFullRaster() {
    const w = canvas.width, h = canvas.height;
    if (w === 0 || h === 0) return;
    canvas.width = 0; canvas.height = 0;
    canvas.width = w; canvas.height = h;
    canvasBlank = true;
    drawView();
  }
  const canvasRO = new ResizeObserver(() => {
    sizeCanvasToDisplay();
    drawView();
    if (settleTimer) clearTimeout(settleTimer);
    settleTimer = setTimeout(forceFullRaster, 120);
  });
  canvasRO.observe(document.querySelector('.main-col') || canvasWrap);
  let dprQuery = null;
  function onDprChange() {
    const oldW = canvas.width;
    sizeCanvasToDisplay();
    if (canvas.width !== oldW) drawView();
    watchDpr();
  }
  function watchDpr() {
    if (dprQuery) dprQuery.removeEventListener('change', onDprChange);
    dprQuery = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
    dprQuery.addEventListener('change', onDprChange);
  }
  watchDpr();

  function viewportFrac(vv) {
    const v = vv || view;
    const z = Math.max(v.scale, 1);
    // scale=1 显示完整流（letterbox 由 contentRect 负责居中），缩放时裁剪。
    const fw = 1 / z;
    const fh = 1 / z;
    let x0 = v.fx - fw / 2;
    let y0 = v.fy - fh / 2;
    x0 = Math.min(Math.max(x0, 0), 1 - fw);
    y0 = Math.min(Math.max(y0, 0), 1 - fh);
    return { x0, y0, fw, fh };
  }

  function viewportMonRect() {
    if (!preview) return null;
    const v = viewportFrac();
    const m = preview.mon;
    const X0 = m.x + Math.round(v.x0 * m.w);
    const Y0 = m.y + Math.round(v.y0 * m.h);
    const X1 = m.x + Math.round((v.x0 + v.fw) * m.w);
    const Y1 = m.y + Math.round((v.y0 + v.fh) * m.h);
    return { x: X0, y: Y0, w: X1 - X0, h: Y1 - Y0 };
  }

  // ---------- 直播源（B站 / 抖音低延迟画面，多路监控） ----------
  // 会话列表：[{ id, room, platform, w, h }]；activeLiveId 为当前主画面。
  let liveSessions = [];
  let activeLiveId = null;
  // 「当前是否在观看直播会话」（有前台会话），而非「是否有任何会话」。
  // 后者会导致：切到桌面但仍有会话时，预览既不拉直播帧也不拉屏幕帧。
  function liveOn() { return activeLiveId !== null; }
  function activeSession() { return liveSessions.find((s) => s.id === activeLiveId) || null; }
  function livePlatformLabel(p) { return (p === 'douyin') ? '抖音' : 'B站'; }

  // 更新视窗信息栏（标题/副标题/状态徽标）。数据源优先前台房间（含未开播）。
  function updateVpInfo() {
    const ttl = $('vpTitle'), sub = $('vpSub'), badge = $('vpBadge');
    if (!ttl) return;
    if (!activeLiveId) {
      ttl.textContent = '屏幕预览';
      sub.textContent = '未连接直播';
      badge.textContent = scanning ? '扫描中' : '待机';
      badge.className = 'badge' + (scanning ? ' live' : '');
      return;
    }
    const room = liveRooms.find((r) => (r.platform + ':' + r.room) === activeLiveId);
    const sess = activeSession();
    const platform = room ? room.platform : (sess ? sess.platform : '');
    const roomNo = room ? room.room : (sess ? sess.room : '');
    const title = (room && room.title) || (sess && sess.title) || roomNo;
    // 与左列同规则：有备注时显示「备注（原标题）」。
    const note = (room && room.note) || '';
    ttl.textContent = note ? (note + '（' + title + '）') : title;
    // 副标题：平台 房间号 · 时长（主播名只在左列与悬浮提示出现）。
    const parts = [];
    parts.push(livePlatformLabel(platform) + ' ' + roomNo);
    const duration = (room && room.live_start) ? fmtDuration(room.live_start) : (sess && sess.duration ? sess.duration : '');
    if (duration) parts.push('时长 ' + duration);
    sub.textContent = parts.join(' · ');
    let stText = '直播中', stCls = 'live';
    const status = sess ? sess.status : (room && room.live_status === 1 ? 'live' : 'off');
    if (status === 'scan') { stText = '识别中'; stCls = 'live'; }
    else if (status === 'done') { stText = '已确认'; stCls = 'live'; }
    else if (status === 'off') { stText = '未开播'; stCls = ''; }
    badge.textContent = stText;
    badge.className = 'badge ' + stCls;
  }

  // 开播时长文本（H:MM:SS）。
  function fmtDuration(start) {
    if (!start || start <= 0) return '';
    const secs = Math.max(0, Math.floor(Date.now() / 1000) - start);
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
    const p = (n) => String(n).padStart(2, '0');
    return h + ':' + p(m) + ':' + p(s);
  }

  // 已保存直播间列表（来自 config.live_history，含元数据缓存；含未开播）。
  let liveRooms = [];

  // 拉取已保存直播间列表（含元数据缓存），保持本地顺序（避免点击后跳序）。
  async function reloadLiveRooms() {
    try {
      const cfg = await invoke('get_config');
      const incoming = cfg.live_history || [];
      const byId = new Map(incoming.map((r) => [r.platform + ':' + r.room, r]));
      // 保持本地已有顺序；合并元数据（保留本地非空值，避免瞬时清空）；追加新房间。
      const merged = [];
      for (const r of liveRooms) {
        const id = r.platform + ':' + r.room;
        const inc = byId.get(id);
        if (inc) {
          // 后端返回的字段可能瞬时为空（刷新中）——保留本地非空值。
          r.title = inc.title || r.title;
          r.nickname = inc.nickname || r.nickname;
          r.cover = inc.cover || r.cover;
          r.room_id = inc.room_id || r.room_id;
          r.live_status = inc.live_status;
          r.note = inc.note || r.note;
          merged.push(r);
          byId.delete(id);
        }
      }
      for (const r of byId.values()) merged.push(r);
      liveRooms = merged;
    } catch (e) { /* 忽略 */ }
    renderLiveTabs();
  }

  // 渲染侧栏直播间列表（"桌面"卡片 + 已保存直播间卡片 + 添加按钮）。
  function renderLiveTabs() {
    const box = $('roomList');
    box.innerHTML = '';
    // 1) "桌面"卡片：切回屏幕预览。
    const desk = document.createElement('div');
