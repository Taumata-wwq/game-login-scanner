[package]
name = "game-login-scanner"
version = "0.2.0"
description = "游戏扫码器"
edition = "2021"

[lib]
name = "game_login_scanner_lib"
crate-type = ["rlib"]
# 内联测试 harness 链接 tauri 后因缺 manifest 在 Windows 启动即崩（见 build.rs），
# 统一改为 tests/ 集成测试，故禁用 lib/bin 的默认测试目标。
test = false

[[bin]]
name = "game-login-scanner"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
# 关闭默认特性：去掉 compression（内嵌资源 brotli）、common-controls-v6、dynamic-acl，
# 本应用前端仅两个内嵌 HTML、静态 capabilities、不调用系统对话框。
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# 与 tauri 拖入的 dirs 保持同一主版本，避免 v5/v6 双份。
dirs = "6"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
# 关闭 env_filter（其 regex 栈约 700KB，本工具只用固定级别过滤）
env_logger = { version = "0.11", default-features = false }

base64 = "0.22"

# HTTP：ureq（阻塞式，经 spawn_blocking 包装），默认特性全关 + native-tls（Windows 走
# 系统 schannel），比 reqwest+hyper 全家桶小 ~1.5MB。
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

# 二维码解码 rqrr（纯 QR，依赖仅 g2p+lru；替代 rxing——其拖 regex/chrono-tz/
# encoding 合计约 1.7MB）；生成 qrcodegen（零依赖）。反色码由解码层翻转重试支持。
rqrr = { version = "0.11", default-features = false }
qrcodegen = "1.8"

# 加密与编码
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
hex = "0.4"
rand = "0.8"
url = "2"
# 米哈游/B站 密码登录：RSA 公钥加密账号密码（PKCS1_v1_5）
rsa = { version = "0.9", features = ["sha2"] }
openh264 = "0.9.8"
# openh264-sys2：解码取帧用 DecodeFrame2(NULL) 裸 API 的 SBufferInfo 类型
openh264-sys2 = "0.9.8"
# 直播流拉取：rustls（纯 Rust TLS，Windows schannel 对 B站 CDN 长连接有读乱码/EOF）
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.4"
rustls-pki-types = "1.15.1"
[features]
custom-protocol = ["tauri/custom-protocol"]

# release：体积优先（opt-level="s"，4.2MB；=3 时 5.3MB）+ strip 符号 + abort 展开。
# 热路径（预览降采样 / 解码）在 "s" 下实测仍满足 60fps 预览与扫码节流预算
# （2560×1440 整屏解码 ~137ms，且受 400ms 节流 + ROI + 指纹去重约束）。
# 注：曾试 thin LTO + codegen-units=1，体积仅减 ~0.3MB，但单次构建增至 ~12 分钟，不启用。
[profile.release]
opt-level = "s"
panic = "abort"
strip = true
# fat LTO + 单 codegen 单元：让链接器跨 crate 做死代码消除（体积优先）。
# 构建耗时增加可接受（release 非高频）。
lto = true
codegen-units = 1

[target.'cfg(windows)'.dependencies]
# 截屏（GDI 兜底）、剪贴板（读图/清空）替代 screenshots / arboard 两个重依赖
# （二者各拖一份 image 全家桶 + 重复的 windows 绑定），全部走系统 API。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
