[package]
name = "game-login-scanner"
version = "0.3.2"
description = "游戏扫码器"
edition = "2021"

[lib]
name = "game_login_scanner_lib"
# rlib：桌面端 bin 通过 lib 调用；
# cdylib：Android 端 Tauri 需要 .so 动态库产物（libgame_login_scanner_lib.so）。
crate-type = ["rlib", "cdylib"]
# 历史：内联测试 harness 链接 tauri 后因缺 manifest 在 Windows 启动即崩，故曾
# 禁用 lib/bin 的默认测试目标，把用例全迁到 tests/。build.rs 现已为测试目标补
# 同款 manifest（embed_resource::compile_for_tests），lib 内联测试恢复可执行
# （watch.rs 3 个协议包用例 + lib.rs 1 个版本号用例，2026-10-17 实测 4 passed）。
# bin 仍禁用：main.rs 只有单实例守卫与 run() 调用，无独立可测逻辑。
test = true

[[bin]]
name = "game-login-scanner"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"
# 显式激活 indexmap@1 的 std（feature 锚点）：tauri-build → tauri-utils(schema)
# → schemars 开启 preserve_order（`Map = indexmap::IndexMap<K, V>`）。当前
# cargo 1.98.1 解析出的 indexmap 1.9.3 单元缺少 std（IndexMap 第三个类型参数
# 无默认值），导致 schemars 编译报 E0107（已实测修复：fastbench 构建恢复正常）。
# indexmap 本就在 tauri-build 依赖树内（不新增链接物、零体积影响，仅修
# feature 组合）；未来 cargo / tauri 上游修复后可移除，保留亦无害。
indexmap = { version = "1.9", default-features = false, features = ["std"] }

[dependencies]
# 关闭默认特性：去掉 common-controls-v6、dynamic-acl；compression（内嵌资源 brotli）
# 经 2026-10-14 A/B 实测**不加**（开=+62.5KB：解压器代码/数据大于资源压缩收益）。
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
log = "0.4"
# 关闭 env_filter（其 regex 栈约 700KB，本工具只用固定级别过滤）
env_logger = { version = "0.11", default-features = false }

base64 = "0.22"


# 二维码解码：rxing（ZXing 的纯 Rust 移植，Apache-2.0）。
# 2026-10-13 实测（24 帧真实 720p 直播画面 + 小码回归样本）：rxing 4.5ms/帧
# vs 旧 zedbar 11.3ms/帧（-60%），检出矩阵（180/300/120/90px，含左右边缘位置）全过，
# 70~200px 小码回归全过；且许可证由 LGPL-3.0 换为 Apache-2.0。
qrcodegen = "1.8"
# 注：encoding_rs 为 rxing 的编译期硬依赖（2026-10-14 实验：去掉后 rxing
# 直接 10 处编译错误）——体积上无法通过裁剪该 feature 优化，保留。
rxing = { version = "0.9", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }

# 加密与编码
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
hex = "0.4"
rand = "0.8"
# 米哈游/B站 密码登录：RSA 公钥加密账号密码（PKCS1_v1_5）
rsa = { version = "0.9", features = ["sha2"] }
# 视频解码：Windows Media Foundation H.264 硬解（系统组件；见 src/mf_decode.rs）。
# 原 openh264 软解回退已于 2026-10-12 移除（300 间直播间零解码错误验证后，
# 硬解稳定性充分；移除同时去掉 openh264 C 库的体积增量）。
# 直播流拉取：rustls（纯 Rust TLS，Windows schannel 对 B站 CDN 长连接有读乱码/EOF）
# `tls12` 必须显式开启：rustls 的 default 里包含它，但这里用了 default-features=false，
# 于是客户端退化成**只支持 TLS 1.3**。Android 无 schannel 回退（http.rs 的
# tls_connect_fallback 在非 Windows 直接返回错误），任何只支持 TLS 1.2 的对端都会
# 直接握手失败——表现为真机上的「系统 TLS 请求失败」。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
# 注：schannel 为 Windows 系统 TLS 栈（http.rs 的 rustls 回退路径），仅 Windows 使用；
# 已移至下方 [target.'cfg(windows)'.dependencies]，Android 用 rustls 单栈。
# 弹幕 WS（开播/下播即时监测，watch.rs）：B站下行批次可能为 zlib（protover=2）。
# 纯 Rust 解压，无 C 依赖；同版本已在依赖树中（tauri-codegen → png → flate2）。
miniz_oxide = "0.8"

# 仅基准使用（不进发布二进制）：zxing-cpp（C++ 参考实现，bundled 编译 C++ 内核，
# Apache-2.0）与 zedbar（旧生产解码器）——在**真实直播帧**上做解码器对照基准
# （docs/调研-QR解码性能-*.md）。二者由 `bench-qr` 特性开启，默认构建不引入，
# 故不影响体积；见 [features] 中该特性与 [[test]] bench_qr_live 的说明。
zxing-cpp = { version = "0.5", features = ["bundled"], optional = true }
zedbar = { version = "0.7", default-features = false, features = ["qrcode"], optional = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
# 二维码解码器对照基准（bench_qr_live 用 zxing-cpp 的 bundled C++ 内核）。
# 该 C++ 库以 release CRT（/MD）构建，而 dev profile 的测试目标链接的是 debug
# CRT（/MDd）→ 默认 `cargo test` 会在链接期报 LNK2001 `__imp__CrtDbgReport`。
# 故把它设为可选特性：默认质量门（`cargo test`）不构建该目标，跑基准时用
# `cargo test --profile fastbench --features bench-qr --test bench_qr_live`。
bench-qr = ["dep:zxing-cpp", "dep:zedbar"]

# 基准目标声明 required-features 后，默认 `cargo test` 不再尝试链接它
# （此前 dev profile 下 `cargo test` 必因 LNK2001 失败，质量门形同不可用）。
[[test]]
name = "bench_qr_live"
path = "tests/bench_qr_live.rs"
required-features = ["bench-qr"]

# release：体积优先（opt-level="s"，4.2MB；=3 时 5.3MB）+ strip 符号 + abort 展开。
# 热路径（预览降采样 / 解码）在 "s" 下实测仍满足 60fps 预览与扫码节流预算
# （2560×1440 整屏解码 ~137ms，且受 400ms 节流 + ROI + 指纹去重约束）。
# 2026-10-14 体积审计：全局 "s"→"z" A/B 实测仅 -3.5KB（噪声级，且部分段反增）
# ——不做此变更；"s" 保持不变。
# 注：曾试 thin LTO + codegen-units=1，体积仅减 ~0.3MB，但单次构建增至 ~12 分钟，不启用。
[profile.release]
opt-level = "s"
panic = "abort"
strip = "symbols"
# fat LTO + 单 codegen 单元：让链接器跨 crate 做死代码消除（体积优先）。
# 构建耗时增加可接受（release 非高频）。
lto = true
codegen-units = 1

# 本 crate 用 "z"（体积优先）：热路径解码在系统 MF 组件（零体积），
# QR 解码在 rxing（独立 crate），Rust 侧主要是 IPC 与整数转换。
[profile.release.package.game-login-scanner]
opt-level = "z"
# 必须在此重复声明 strip：Cargo 对「存在 package 覆写块」的包不继承父 profile 的
# strip，会静默退回 debuginfo（保留 .symtab/.strtab）。Android release .so 因此曾
# 从 6.8MB 膨胀到 13.6MB（.strtab 一项就 4.7MB）。此处显式声明后 strip=symbols 生效。
strip = "symbols"

# 体积再裁剪：事件驱动 / 低频路径的 crate 用 "z"（性能不敏感）。
[profile.release.package.tauri]
opt-level = "z"
[profile.release.package.tao]
opt-level = "z"
[profile.release.package.wry]
opt-level = "z"
[profile.release.package.muda]
opt-level = "z"
[profile.release.package.tauri-runtime-wry]
opt-level = "z"
[profile.release.package.tauri-runtime]
opt-level = "z"
[profile.release.package.tauri-utils]
opt-level = "z"
[profile.release.package.rustls]
# rustls 在直播拉流热路径上做 TLS 解密，对指令级优化敏感；"z"（体积优先）会
# 降低解密吞吐。这里用 2（速度/体积折中），与 MF 解码路径的吞吐要求对齐。
opt-level = 2
[profile.release.package.serde_json]
opt-level = "z"
[profile.release.package.rsa]
opt-level = "z"
[profile.release.package.num-bigint-dig]
opt-level = "z"
[profile.release.package.schannel]
opt-level = "z"
[profile.release.package.webview2-com]
opt-level = "z"
[profile.release.package.rustls-native-certs]
opt-level = "z"
# dirs 仍由 tauri 依赖树带入（供其配置路径使用），保留低优化级别覆写以压体积。
[profile.release.package.dirs]
opt-level = "z"
[profile.release.package.hex]
opt-level = "z"
[profile.release.package.base64]
opt-level = "z"
[profile.release.package.windows]
opt-level = "z"
[profile.release.package.webview2-com-sys]
opt-level = "z"

# 基准 / 快速迭代测试专用：继承 release 的优化配置、关闭 fat LTO。
# 动机：release 的全量 LTO 构建约 12 分钟，基准「优化前后对比」不可接受。
# 用法：cargo test --profile fastbench --test bench_qr_live -- --ignored --nocapture
# 注：不配置 [profile.fastbench.package.*] 覆写（本 crate 用继承的 "s"）。
[profile.fastbench]
inherits = "release"
lto = false
codegen-units = 16

[target.'cfg(windows)'.dependencies]
# Windows 系统 TLS 栈（http.rs 的 rustls 回退路径；B站/抖音 CDN 指纹兼容）。
schannel = "0.1.29"
# 截屏（GDI 兜底）、剪贴板（读图/清空）替代 screenshots / arboard 两个重依赖
# （二者各拖一份 image 全家桶 + 重复的 windows 绑定），全部走系统 API。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Variant",
    # CPU 分项探针（tests/probe_live_profile.rs）用 GetProcessTimes 取进程级 CPU 时间。
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "android")'.dependencies]
# Android 根证书集（Mozilla，内置）。
# 必需：`rustls-native-certs` 在 Android 上**没有系统根证书来源**（返回空集），
# 而 schannel 回退是 Windows 独有 → 空根证书库会让**每一次** HTTPS 握手都
# `UnknownIssuer` 失败（2026-10-16 真机实测：开播监测/B站元数据/登录全不可用）。
# 桌面端继续用系统证书库（可含企业/自签根），故仅 Android 引入本 crate。
webpki-roots = "1"
# MediaCodec 硬件解码绑定（直播解码后端；替代桌面端 mf_decode.rs）。
# 0.1.11，含 MediaCodec/MediaExtractor/MediaMuxer 的安全 buffer 抽象。
anodecs = "0.1"
# JNI 桥接（Kotlin 插件层 ↔ Rust）。
jni = "0.22"
# Android 日志输出（转发 log crate 到 logcat）。
android_logger = { version = "0.15", default-features = false }
# NDK 上下文（JNI 环境中获取 JavaVM / Context）。
ndk-context = "0.1"

[dev-dependencies]
# （二维码解码器对照基准的两个依赖在 [dependencies] 中标记 optional——dev-dependencies
#  不允许 optional，而「默认 cargo test 不构建基准目标」必须靠 optional + required-features。）
