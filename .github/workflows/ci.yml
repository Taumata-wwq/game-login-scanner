name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    # rust-toolchain.toml 声明的是 "stable"，其优先级高于 rustup 的 default，
    # 会让下面 dtolnay/rust-toolchain@1.98.1 的版本固定失效。RUSTUP_TOOLCHAIN
    # 的优先级高于 rust-toolchain.toml（低于命令行 +toolchain），显式设置才能
    # 保证 CI 真用 1.98.1；本地开发不受影响（仍按 rust-toolchain.toml 走 stable）。
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      # v4 的 action 跑在 Node 20 上，GitHub 已标记弃用（runner 会强制用 Node 24 并
      # 打印告警）。升到 v5 直接以 Node 24 运行，消掉这条噪音。
      - uses: actions/checkout@v5

      - name: Install Rust
        # 固定 1.98.1（稳定性偏好，保留）。
        # 2026-10-15 更正：此前 CI 失败（invalid instruction `cargo:rustc-link-arg-tests`）
        # 的真因是 build.rs 在无 tests/ 目录时发出该指令，被 cargo 以 "does not have
        # a test target" 拒绝；已修复于 build.rs（保留目录存在性守卫）。
        # 2026-10-17 起 tests/unit.rs 与 tests/smoke.rs 白名单入库——下方 cargo test
        # 真实运行用例（此前因无测试目标而空转）。
        # 同日恢复 [lib] test=true（watch.rs / lib.rs 内联测试重新执行），并新增
        # [[test]] bench_qr_live（required-features = "bench-qr"，CI 不启用 → 不参与）。
        # 当前共 115 个用例（lib 19 + smoke 1 + unit 95）。
        #
        # 必须显式列出 components：该 action 默认 --profile minimal（不含 rustfmt/clippy）。
        # 2026-10-21 更正：此前能过是因为 rust-toolchain.toml 里的 stable + components
        # 生效；上一行改为 RUSTUP_TOOLCHAIN=1.98.1 覆盖后，1.98.1 只有 minimal，
        # cargo fmt --check 直接报 "'cargo-fmt.exe' is not installed for the toolchain"。
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # Android 侧是 Kotlin / PowerShell / Python，windows-latest 上没有 Android SDK，
      # 编译不了；但下面两项不变量无需 SDK 即可完整校验（2026-10-21 审计 P3-13 补）。
      # 前端纯逻辑单测：core.js 的白名单/渠道表直接与 Rust 源码对照（跨语言漂移门禁）。
      - name: 前端纯逻辑单测（node:test）
        run: node --test tests-js/

      - name: 校验 Android 构建脚本语法
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem scripts/android/*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) {
              Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad = 1
            }
          }
          if ($bad -ne 0) { exit 1 }
          Write-Host "[OK] scripts/android/*.ps1 语法正确"

      - name: 校验 Kotlin↔Rust JNI 契约
        run: python scripts/android/check_jni_contract.py
