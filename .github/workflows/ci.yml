name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    # rust-toolchain.toml 声明的是 "stable"，其优先级高于 rustup 的 default，
    # 会让下面 dtolnay/rust-toolchain@1.98.1 的版本固定失效。RUSTUP_TOOLCHAIN
    # 的优先级高于 rust-toolchain.toml（低于命令行 +toolchain），显式设置才能
    # 保证 CI 真用 1.98.1；本地开发不受影响（仍按 rust-toolchain.toml 走 stable）。
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      # v4 的 action 跑在 Node 20 上，GitHub 已标记弃用（runner 会强制用 Node 24 并
      # 打印告警）。升到 v5 直接以 Node 24 运行，消掉这条噪音。
      - uses: actions/checkout@v5

      - name: Install Rust
        # 固定 1.98.1（稳定性偏好，保留）。
        # 2026-10-15 更正：此前 CI 失败（invalid instruction `cargo:rustc-link-arg-tests`）
        # 的真因是 build.rs 在无 tests/ 目录时发出该指令，被 cargo 以 "does not have
        # a test target" 拒绝；已修复于 build.rs（保留目录存在性守卫）。
        # 2026-10-17 起 tests/unit.rs 与 tests/smoke.rs 白名单入库——下方 cargo test
        # 真实运行用例（此前因无测试目标而空转）。
        # 同日恢复 [lib] test=true（watch.rs / lib.rs 内联测试重新执行），并新增
        # [[test]] bench_qr_live（required-features = "bench-qr"，CI 不启用 → 不参与）。
        # 当前共 115 个用例（lib 19 + smoke 1 + unit 95）。
        #
        # 必须显式列出 components：该 action 默认 --profile minimal（不含 rustfmt/clippy）。
        # 2026-10-21 更正：此前能过是因为 rust-toolchain.toml 里的 stable + components
        # 生效；上一行改为 RUSTUP_TOOLCHAIN=1.98.1 覆盖后，1.98.1 只有 minimal，
        # cargo fmt --check 直接报 "'cargo-fmt.exe' is not installed for the toolchain"。
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # Android 侧是 Kotlin / PowerShell / Python，windows-latest 上没有 Android SDK，
      # 编译不了；但下面两项不变量无需 SDK 即可完整校验（2026-10-21 审计 P3-13 补）。
      # 前端纯逻辑单测：core.js 的白名单/渠道表直接与 Rust 源码对照（跨语言漂移门禁）。
      - name: 前端纯逻辑单测（node:test）
        # 显式列出文件：Node 22 的 --test 不接受目录（会当成模块 require 而报
        # MODULE_NOT_FOUND），Node 24 才支持目录。写死文件名对两个版本都成立。
        run: node --test tests-js/core.test.js

      - name: 校验 Android 构建脚本语法
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem scripts/android/*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) {
              Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad = 1
            }
          }
          if ($bad -ne 0) { exit 1 }
          Write-Host "[OK] scripts/android/*.ps1 语法正确"

      - name: 校验 Kotlin↔Rust JNI 契约
        run: python scripts/android/check_jni_contract.py

      # Android 目标的 Rust 编译门禁。
      #
      # 为什么必需：`cfg(target_os = "android")` 分支**在 Windows 上完全不编译**，
      # 于是「模块拆分后 commands 里少了 crate:: 前缀」这类错误本地 cargo check
      # 与 cargo test 全绿、只有真机构建才炸（本轮就是这样才发现的）。这一条把
      # 发现时机从「构建 APK 的 5 分钟后」提前到 CI 的 2 分钟。
      #
      # 注意：只装 NDK 的 clang 足够 check；不装 Kotlin/Gradle（那是本地脚本的事）。
      - name: Android 目标 cargo check
        shell: pwsh
        run: |
          # 用正斜杠拼路径：PowerShell 完全接受，也避免 YAML/转义层面的坑。
          $sdk = $env:ANDROID_SDK_ROOT
          $ndk = $env:ANDROID_NDK_HOME
          if (-not $ndk) {
            $ndk = (Get-ChildItem (Join-Path $sdk "ndk") -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1).FullName
          }
          if (-not $ndk) { Write-Host "::error::找不到 NDK"; exit 1 }
          $tc = Join-Path $ndk "toolchains/llvm/prebuilt/windows-x86_64/bin"
          $cc = Join-Path $tc "aarch64-linux-android24-clang.cmd"
          if (-not (Test-Path $cc)) { Write-Host "::error::缺少 NDK clang：$cc"; exit 1 }
          $env:PATH = "$tc;$env:PATH"
          $env:CC_aarch64_linux_android = $cc
          $env:AR_aarch64_linux_android = Join-Path $tc "llvm-ar.exe"
          $env:CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = $cc
          rustup target add aarch64-linux-android
          cd src-tauri
          cargo check --target aarch64-linux-android --message-format=short
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Android 目标编译失败"; exit 1 }
          Write-Host "[OK] Android 目标（aarch64-linux-android）cargo check 通过"